[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesave-cloud"
version = "0.2.0"
description = "Git-backed snapshots, branching and cloud sync for game save folders"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "gitpython>=3.1",
    "watchdog>=4.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "keyring>=25.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "black>=24.0",
    "flake8>=7.0",
    "pre-commit>=3.6",
]

[project.scripts]
gsc = "src.cli.main:cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 79
target-version = ["py310"]
